<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drone Deliveries</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Clash+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div id="root">
      <header>
        <div class="logo">VRP<em>.</em>DRONE</div>
        <div style="display: flex; align-items: center; gap: 16px">
          <span
            style="font-size: 10px; color: var(--muted); letter-spacing: 0.06em"
            >ALGORITHM</span
          >
          <div class="algo-toggle">
            <button class="algo-btn active" id="btnA" onclick="switchAlgo('A')">
              A · MST+2opt+split
            </button>
            <button class="algo-btn" id="btnB" onclick="switchAlgo('B')">
              B · MST+K-cut+NN
            </button>
          </div>
        </div>
      </header>

      <div class="map-wrap">
        <canvas id="map"></canvas>
        <div class="map-hint" id="hint">
          <div class="map-hint-inner">
            <strong>click to begin</strong>
            place depot · then add stops
          </div>
        </div>
      </div>

      <div class="pareto-wrap">
        <div class="pareto-hdr">
          <span>Pareto frontier — K vs Makespan</span>
          <span class="statusbar" id="statusbar"
            >run solver at different K values to build frontier</span
          >
        </div>
        <canvas id="pareto"></canvas>
      </div>

      <div class="sidebar">
        <div class="panel">
          <div class="plabel">Placement</div>
          <div class="mode-row">
            <button
              class="mbtn depot active"
              id="mDepot"
              onclick="setMode('depot')"
            >
              <span class="mdot"></span>Depot
            </button>
            <button class="mbtn point" id="mPoint" onclick="setMode('point')">
              <span class="mdot"></span>Stops
            </button>
          </div>
        </div>

        <div class="panel">
          <div class="plabel">Stats</div>
          <div class="sgrid">
            <div class="sbox">
              <div class="sv" id="sv-stops">0</div>
              <div class="sk">stops</div>
            </div>
            <div class="sbox">
              <div class="sv" id="sv-k">1</div>
              <div class="sk">drones</div>
            </div>
            <div class="sbox">
              <div class="sv" id="sv-makespan">—</div>
              <div class="sk">makespan</div>
            </div>
            <div class="sbox">
              <div class="sv" id="sv-total">—</div>
              <div class="sk">total dist</div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="plabel">Drones (K)</div>
          <div class="k-row">
            <div class="k-val" id="kval">1</div>
            <div style="flex: 1">
              <input
                type="range"
                id="kslider"
                min="1"
                max="10"
                value="1"
                oninput="onK(+this.value)"
              />
              <div class="k-sub" id="ksub">1 drone · no decomposition</div>
            </div>
          </div>
          <div class="drone-list" id="dronelist"></div>
        </div>

        <div class="panel">
          <div class="plabel">Phase</div>
          <div class="phase-list" id="phases"></div>
        </div>

        <div class="panel">
          <div class="plabel">Speed</div>
          <div class="speed-row">
            <label>slow</label>
            <input type="range" id="speed" min="1" max="6" value="3" />
            <label>fast</label>
            <button class="pause-btn" id="pausebtn" onclick="togglePause()">
              ⏸ pause
            </button>
          </div>
        </div>

        <div class="panel">
          <button class="abtn run" id="btnRun" onclick="runSolve()" disabled>
            Run →
          </button>
          <button class="abtn clr" onclick="clearAll()">Clear all</button>
          <button class="abtn clrp" onclick="clearPareto()">
            Clear Pareto points
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
